<body>
    <style>
        .main_msg {
          visibility: hidden;
          background-color: blueviolet;
          width: 300px;
          margin-right: 0;
          margin-left: auto;
          padding: 5px;
        }
        .content {
          vertical-align: middle
          
        }
  
        .content p {
          color:aliceblue;
        }
      </style>
      
      <div class="main_msg" id="main_msg">
        <div class="content">
          <p id="db_notify"></p>
          <div>
            <button onclick="closePopup()">YES</button>
            <button onclick="closePopup()">NO</button>
          </div>
        </div>
      </div>

    <h2>Уведомления:</h2>
    <ul id="notifications">
        <li>test part of notifications</li>
        <li id="real"></li>
    </ul>

    <script>
        var notificationsList = document.getElementById("notifications"); 
        const socket = new WebSocket("ws://127.0.0.1:8000/ws/chat/notifications/");

        socket.onmessage = function(event) {
            const data = JSON.parse(event.data);
            const message = data.message;

            var listItem = document.createElement("li");
            //var notify = document.getElementById("real");
            //notify.textContent = message;
            listItem.textContent = message;
            notificationsList.appendChild(listItem);

            var popup = document.getElementById("main_msg");
            var popupText = document.getElementById("db_notify");
            popupText.textContent = message;
            popup.style.visibility = "visible";

            // Удаление через 60 секунд после появления
            setTimeout(() => {
                if (listItem.parentNode) { 
                    listItem.remove();
                }
            }, 60000); // 60 секунд
        };
    </script>

    <script>
        function closePopup() {
          var popup = document.getElementById('main_msg')
          popup.style.visibility = "collapse"
        }
      </script>
</body>
</html>
